name: Release

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm test
      - name: Publish @fin14/core if new
        run: |
          version=$(node -p "require('./packages/core/package.json').version")
          if [ -n "$(npm view "@fin14/core@$version" version 2>/dev/null || true)" ]; then
            echo "@fin14/core@$version already published, skipping"
          else
            npm publish -w @fin14/core
          fi
      - name: Publish @fin14/cli if new
        run: |
          version=$(node -p "require('./packages/cli/package.json').version")
          if [ -n "$(npm view "@fin14/cli@$version" version 2>/dev/null || true)" ]; then
            echo "@fin14/cli@$version already published, skipping"
          else
            npm publish -w @fin14/cli
          fi
